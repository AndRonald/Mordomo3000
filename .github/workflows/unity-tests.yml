name: Unity tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unity-tests:
    name: ${{ matrix.testMode }} tests (Unity 6000.6.7f1)
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.6.7f1
          testMode: ${{ matrix.testMode }}
          githubToken: ''
          artifactsPath: artifacts/${{ matrix.testMode }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}-results
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: ignore
